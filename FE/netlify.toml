# Netlify Configuration File
# This file overrides the settings in the Netlify UI to ensure the build works correctly.

[build]
  # The directory where the frontend code lives
  base = "FE"
  
  # The command to run to build the project
  command = "npm run build"
  
  # The directory that contains the built assets (relative to 'base')
  publish = "dist"

# Handling React Router client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://masterdzzzz-vietrans-backend.hf.space https://accounts.google.com http://localhost:8000 http://127.0.0.1:8000; frame-src 'self' https://accounts.google.com; worker-src 'self' blob:; child-src 'self' blob: https://accounts.google.com; manifest-src 'self'; upgrade-insecure-requests"
