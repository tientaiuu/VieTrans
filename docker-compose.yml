services:
  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile.dev
    image: vietrans-frontend:local
    container_name: vietrans-frontend
    restart: unless-stopped
    ports:
      - "${VIETRANS_FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: "${VITE_API_URL:-}"
      VITE_DEV_API_PROXY: "${VITE_DEV_API_PROXY:-http://gateway:7860}"
    depends_on:
      - gateway

  gateway:
    build:
      context: ./BE-Models
      dockerfile: Dockerfile
    image: vietrans-gateway:local
    container_name: vietrans-gateway
    restart: unless-stopped
    ports:
      - "${VIETRANS_GATEWAY_PORT:-8001}:7860"
    environment:
      MONGO_URI: "${MONGO_URI:?MONGO_URI is required. Use MongoDB Atlas connection string}"
      MONGO_DB: "${MONGO_DB:-vietrans}"
      IIMT_WORKER_URL: "${IIMT_WORKER_URL:-http://host.docker.internal:8081}"
      IIMT_WORKER_TIMEOUT_SECONDS: "${IIMT_WORKER_TIMEOUT_SECONDS:-300}"
      IIMT_WORKER_MODE: "${IIMT_WORKER_MODE:-sync}"
      IIMT_WORKER_POLL_INTERVAL_SECONDS: "${IIMT_WORKER_POLL_INTERVAL_SECONDS:-2}"
      IIMT_WORKER_API_KEY: "${IIMT_WORKER_API_KEY:-}"
      VIETRANS_MAX_UPLOAD_MB: "${VIETRANS_MAX_UPLOAD_MB:-20}"
      VIETRANS_RUNTIME_DIR: "/app/outputs/gateway"
      AUTH_ENABLED: "${AUTH_ENABLED:-true}"
      FRONTEND_BASE_URL: "${FRONTEND_BASE_URL:-http://localhost:5173}"
      SECRET_KEY: "${SECRET_KEY:-change-this-secret-key}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_SERVER: "${MAIL_SERVER:-smtp.gmail.com}"
    volumes:
      - gateway_outputs:/app/outputs/gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  gateway_outputs:
