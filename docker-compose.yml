services:
  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile.dev
    image: vietrans-frontend:local
    container_name: vietrans-frontend
    restart: unless-stopped
    ports:
      - "${VIETRANS_FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: "http://localhost:${VIETRANS_GATEWAY_PORT:-8001}"
    depends_on:
      - gateway

  gateway:
    build:
      context: ./BE-Models
      dockerfile: Dockerfile
    image: vietrans-gateway:local
    container_name: vietrans-gateway
    restart: unless-stopped
    ports:
      - "${VIETRANS_GATEWAY_PORT:-8001}:7860"
    environment:
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DB: "${MONGO_DB:-vietrans}"
      IIMT_WORKER_URL: "${IIMT_WORKER_URL:-http://host.docker.internal:8081}"
      IIMT_WORKER_TIMEOUT_SECONDS: "${IIMT_WORKER_TIMEOUT_SECONDS:-300}"
      VIETRANS_MAX_UPLOAD_MB: "${VIETRANS_MAX_UPLOAD_MB:-20}"
      VIETRANS_RUNTIME_DIR: "/app/outputs/gateway"
      AUTH_ENABLED: "${AUTH_ENABLED:-true}"
      SECRET_KEY: "${SECRET_KEY:-change-this-secret-key}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_SERVER: "${MAIL_SERVER:-smtp.gmail.com}"
    volumes:
      - gateway_outputs:/app/outputs/gateway
    depends_on:
      mongo:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mongo:
    image: mongo:7
    container_name: vietrans-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  gateway_outputs:
  mongo_data:
